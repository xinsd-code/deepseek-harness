# Desktop carrier overlay over the shipped Web profile. The Host graph and
# client roster stay shared; only the browser HTTP publication rows change.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: modules
  config:
    carrier: electron

- id: connection
  inject: []
  config:
    carrier: electron

# The adaptive picker waits for WebServer state before choosing a surface.
# Electron has a local display and no WebServer, so pin the native pair.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'
    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
